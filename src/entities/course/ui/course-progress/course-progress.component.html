<div class="course-progress">
	<h3 class="course-progress__title">Статистика курса</h3>

	<div class="course-progress__chart">
		<app-circular-progress [value]="progress().percentage" [size]="160" [strokeWidth]="12" />
	</div>

	<div class="course-progress__stats">
		<span class="course-progress__stats-label">Просмотрено:</span>
		<span class="course-progress__stats-value"
			>{{ progress().completedLessons }} / {{ progress().totalLessons }}</span
		>
	</div>
</div>
