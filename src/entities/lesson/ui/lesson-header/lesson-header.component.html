<header class="lesson-header">
	<div class="header-top">
		<h1 class="title">{{ lesson().sequenceOrder }} - {{ lesson().title }}</h1>
		<div class="duration">
			<app-icon name="clock" />
			{{ lesson().durationSeconds / 60 | number: "1.0-0" }} min
		</div>
	</div>

	<p class="description">
		{{ lesson().description }}
	</p>
</header>
