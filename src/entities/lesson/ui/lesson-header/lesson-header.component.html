<header class="lesson-header">
	<div class="lesson-header__top">
		<h1 class="lesson-header__title">{{ lesson().sequenceOrder }} - {{ lesson().title }}</h1>
		<div class="lesson-header__duration">
			<app-icon name="clock" />
			{{ durationMinutes() }} min
		</div>
	</div>

	@if (lesson().description) {
		<p class="lesson-header__description">
			{{ lesson().description }}
		</p>
	}
</header>
