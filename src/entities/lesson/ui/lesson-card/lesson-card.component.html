<div class="lesson-card" [class.lesson-card--active]="isActive()" [class.lesson-card--locked]="isLocked()">
	<button type="button" class="lesson-card__button" [disabled]="isLocked()" (click)="onSelect()">
		<span class="lesson-card__title">{{ lesson().sequenceOrder }} - {{ lesson().title }}</span>
	</button>

	<span
		class="lesson-card__status"
		[class.lesson-card__status--free]="lesson().isFree && !lesson().isCompleted"
		[class.lesson-card__status--completed]="lesson().isCompleted"
	>
		@if (lesson().isCompleted) {
			<app-icon name="check" size="s" />
		} @else if (lesson().isFree) {
			FREE
		} @else {
			<app-icon name="lock" size="s" />
		}
	</span>
</div>
