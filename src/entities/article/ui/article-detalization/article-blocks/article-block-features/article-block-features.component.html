<div class="article-block-features">
	@if (data().sectionTitle) {
		<h3 class="article-block-features__title">{{ data().sectionTitle }}</h3>
	}
	<ul class="article-block-features__list">
		@for (item of data().items; track item.title) {
			<li class="article-block-features__item">
				<strong class="article-block-features__keyword">{{ item.title }}</strong>
				<span class="article-block-features__text"> \u2014 {{ item.text }}</span>
			</li>
		}
	</ul>
</div>
