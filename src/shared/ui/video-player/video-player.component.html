<div class="video-player">
	@if (src(); as videoSrc) {
		<video
			[src]="videoSrc"
			[poster]="poster() ?? ''"
			[controls]="controls()"
			class="video-player__element"
			preload="metadata"
		>
			Ваш браузер не поддерживает воспроизведение видео.
		</video>
	} @else {
		<div class="video-player__placeholder">
			<span>Источник видео не указан</span>
		</div>
	}
</div>
