<div class="draw-sidebar">
	<button
		app-button
		type="button"
		variant="fab"
		color="primary"
		(click)="toggleArticlesOpen()"
		aria-label="Открыть глоссарий"
		title="Открыть глоссарий"
	>
		<span class="draw-sidebar__content" aria-hidden="true">
			<app-icon name="book-open" size="m" />
			<span>A-Z</span>
		</span>
	</button>
</div>

<app-drawer [(isOpen)]="isArticlesOpen">
	<div drawer-header>Глоссарий</div>

	<div class="drawer-inner-content">
		<div
			class="drawer-inner-content__panel drawer-inner-content__panel--nav"
			[class.drawer-inner-content__panel--shifted]="!!selectedArticleId()"
		>
			<div class="drawer-inner-content__scroll-wrapper">
				<app-article-drawer-navigation
					[selectedId]="selectedArticleId()"
					[isAdmin]="isAdmin()"
					(articleSelected)="onArticleSelected($event)"
					(editArticle)="onEditArticle($event)"
					(deleteArticle)="requestDeleteArticle($event)"
				/>
			</div>
		</div>

		<div
			class="drawer-inner-content__panel drawer-inner-content__panel--article"
			[class.drawer-inner-content__panel--active]="!!selectedArticleId()"
		>
			<div class="drawer-inner-content__scroll-wrapper">
				@if (selectedArticleId(); as id) {
					<button
						app-button
						type="button"
						variant="clear"
						size="m"
						(click)="backToNavigation()"
						aria-label="Вернуться к списку статей"
					>
						<div class="back">
							<span aria-hidden="true">←</span>
							Назад к списку
						</div>
					</button>

					<app-article-view [articleId]="id" />
				}
			</div>
		</div>
	</div>
</app-drawer>

@if (deleteTargetId()) {
	<app-modal [isOpen]="true" size="xs" (isOpenChange)="!$event && cancelDelete()">
		<div class="delete-confirm">
			<p class="delete-confirm__title">Удалить статью?</p>
			<p class="delete-confirm__text">Это действие необратимо.</p>
			<div class="delete-confirm__actions">
				<button app-button type="button" variant="outline" [disabled]="isDeleting()" (click)="cancelDelete()">
					Отмена
				</button>
				<button
					app-button
					type="button"
					variant="filled"
					color="error"
					[disabled]="isDeleting()"
					(click)="confirmDelete()"
				>
					@if (!isDeleting()) {
						<span>Удалить</span>
					} @else {
						<span>Удаление…</span>
					}
				</button>
			</div>
		</div>
	</app-modal>
}
